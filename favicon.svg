<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="13" fill="#0e1219"/>
  <g stroke-linecap="square" fill="none">
    <!-- Verbindungen in W-Richtung -->
    <g stroke="#e868ff" stroke-width="3.2">
      <path d="M12 12 L24 24 M52 12 L40 24 M12 52 L24 40 M52 52 L40 40"/>
    </g>
    <!-- äußerer Würfel (Ansicht von vorn): X rot, Y grün -->
    <path d="M12 12 H52 M12 52 H52" stroke="#ff6060" stroke-width="4.2"/>
    <path d="M12 12 V52 M52 12 V52" stroke="#5cdc7c" stroke-width="4.2"/>
    <!-- innerer Würfel -->
    <path d="M24 24 H40 M24 40 H40" stroke="#ff6060" stroke-width="3"/>
    <path d="M24 24 V40 M40 24 V40" stroke="#5cdc7c" stroke-width="3"/>
  </g>
</svg>
